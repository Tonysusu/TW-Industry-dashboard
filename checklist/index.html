<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股 Check List</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', monospace, sans-serif; background: #f5f5f5; color: #222; padding: 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 14px; color: #333; }

  /* ── Tag input area ── */
  .tag-box {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    background: #fff; border: 1px solid #ccc; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 10px; cursor: text;
    min-height: 44px;
  }
  .tag-box:focus-within { border-color: #1a6fd8; box-shadow: 0 0 0 2px #d0e4fb; }

  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: #e8f0fe; color: #1a4fa0; border-radius: 20px;
    padding: 3px 10px 3px 12px; font-size: 0.9rem; white-space: nowrap;
  }
  .tag .del {
    cursor: pointer; font-size: 1rem; line-height: 1; color: #888;
    padding: 0 2px;
  }
  .tag .del:hover { color: #c0392b; }

  #stockInput {
    border: none; outline: none; font-size: 1rem;
    min-width: 80px; flex: 1; background: transparent;
    padding: 2px 0;
  }
  #addBtn {
    padding: 4px 12px; background: #1a6fd8; color: #fff;
    border: none; border-radius: 20px; font-size: 0.85rem;
    cursor: pointer; white-space: nowrap; flex: none; max-width: none;
  }
  #addBtn:hover { background: #155bb5; }

  .btn-row { display: flex; gap: 8px; margin-bottom: 16px; }
  button {
    padding: 10px 20px; background: #1a6fd8; color: #fff;
    border: none; border-radius: 8px; font-size: 1rem; cursor: pointer;
    flex: 1; max-width: 160px;
  }
  button:hover { background: #155bb5; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #clearBtn { background: #eee; color: #555; }
  #clearBtn:hover { background: #ddd; }

  .hint { font-size: 0.8rem; color: #888; margin-bottom: 18px; }

  .result-block {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 16px; margin-bottom: 14px;
  }
  .result-block h2 { font-size: 1rem; margin-bottom: 10px; color: #555; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  .row { padding: 4px 0; font-size: 0.92rem; line-height: 1.6; word-break: break-all; }
  .ok   { color: #2a7a2a; }
  .warn { color: #c07800; }
  .bad  { color: #c0392b; font-weight: bold; }
  .info { color: #1a6fd8; }
  .link a { color: #1a6fd8; font-size: 0.85rem; }
  .link-note { font-size: 0.8rem; color: #888; margin-left: 4px; }

  #loading { color: #888; font-size: 0.9rem; margin: 12px 0; }
  #error   { color: #c0392b; font-size: 0.9rem; margin: 12px 0; }

  .guide {
    background: #f0f4ff; border: 1px solid #c8d8f8; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 0.82rem; color: #444; line-height: 1.8;
  }
  .guide b { color: #1a4fa0; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    button { font-size: 0.95rem; padding: 10px 14px; }
    .row { font-size: 0.88rem; }
  }
</style>
</head>
<body>

<h1>📋 台股 Check List</h1>

<div class="tag-box" id="tagBox" onclick="document.getElementById('stockInput').focus()">
  <!-- tags inserted here by JS -->
  <input type="text" id="stockInput" placeholder="輸入代號" maxlength="6" inputmode="numeric">
  <button id="addBtn" onclick="addFromInput()" type="button">＋新增</button>
</div>
<div id="inputErr" style="display:none;color:#c0392b;font-size:0.82rem;margin:-6px 0 8px 2px"></div>
<div class="btn-row">
  <button id="queryBtn" onclick="runCheck()">查詢</button>
  <button id="clearBtn" onclick="clearAll()">清除</button>
</div>
<div class="guide">
  <b>操作方式</b><br>
  ① 在框內輸入股票代號（4~6碼）→ 按 <b>＋新增</b> 或鍵盤 <b>Enter</b> 新增標籤<br>
  ② 可重複新增多檔，標籤上的 <b>×</b> 可刪除單一檔<br>
  ③ 按 <b>查詢</b> 一次跑完所有股票<br>
  ④ 按 <b>清除</b> 全部重來<br>
  <b>顏色說明</b>：🟢 正常｜🟡 注意｜🔴 警示/風險｜🔵 公告資訊
</div>

<div id="loading" style="display:none">⏳ 查詢中，請稍候...</div>
<div id="error"  style="display:none"></div>
<div id="results"></div>

<script>
const CORS_PROXY = 'https://corsproxy.io/?url=';
const TODAY = new Date();

function fmtDate(d) {
  return d.toISOString().slice(0,10).replace(/-/g,'');
}
function addDays(d, n) {
  const r = new Date(d); r.setDate(r.getDate() + n); return r;
}
function rocToDate(roc) {
  // "115/08/28" → Date
  const p = roc.trim().split('/');
  if (p.length < 3) return null;
  return new Date(parseInt(p[0]) + 1911, parseInt(p[1]) - 1, parseInt(p[2]));
}
function daysDiff(d1, d2) {
  return Math.round((d2 - d1) / 86400000);
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
async function fetchText(url) {
  const r = await fetch(CORS_PROXY + encodeURIComponent(url));
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.text();
}

// ── 快取 ──
const _cache = {};
async function cached(key, fn) {
  if (!_cache[key]) _cache[key] = await fn();
  return _cache[key];
}

// ── 資料拉取 (TWSE 上市) ──
async function getPunish() {
  return cached('punish', () => fetchJSON('https://www.twse.com.tw/rwd/zh/announcement/punish?response=json'));
}
async function getNotice() {
  return cached('notice', () => fetchJSON('https://www.twse.com.tw/rwd/zh/announcement/notice?response=json'));
}
async function getMargin() {
  return cached('margin', () => fetchJSON('https://www.twse.com.tw/rwd/zh/marginTrading/TWT93U?response=json&stockNo=2330'));
}

// ── 資料拉取 (TPEx 上櫃，需 proxy) ──
async function fetchTPExJSON(url) {
  const text = await fetchText(url);
  return JSON.parse(text);
}
async function getTpexPunish() {
  return cached('tpex_punish', () => fetchTPExJSON('https://www.tpex.org.tw/www/zh-tw/bulletin/disposal'));
}
async function getTpexNotice() {
  return cached('tpex_notice', () => fetchTPExJSON('https://www.tpex.org.tw/www/zh-tw/bulletin/attention'));
}
async function getTpexMargin() {
  return cached('tpex_margin', () => fetchTPExJSON('https://www.tpex.org.tw/www/zh-tw/margin/balance'));
}
async function getExRight(startD, endD) {
  const key = `exright_${startD}_${endD}`;
  return cached(key, () => fetchJSON(
    `https://www.twse.com.tw/rwd/zh/exRight/TWT49U?response=json&startDate=${startD}&endDate=${endD}`
  ));
}
async function getMarginOpen(startD, endD) {
  const key = `marginopen_${startD}_${endD}`;
  return cached(key, () => fetchJSON(
    `https://www.twse.com.tw/rwd/zh/announcement/announcement?startDate=${startD}&endDate=${endD}&keyword=${encodeURIComponent('得為融資融券')}`
  ));
}
async function getFuturesList() {
  return cached('futures', async () => {
    const html = await fetchText('https://www.taifex.com.tw/cht/2/stockLists');
    const codes = [...html.matchAll(/\b([0-9]{4,5})\b/g)].map(m => m[1]);
    return new Set(codes);
  });
}
async function getTaifexAnnouncements() {
  return cached('taifex_ann', async () => {
    return fetchText('https://www.taifex.com.tw/cht/11/announcement');
  });
}

// ── 各項檢查 ──
function row(cls, text) {
  return `<div class="row ${cls}">${text}</div>`;
}

async function checkPunish(stockNo) {
  // TWSE 上市
  const twse = await getPunish();
  const twseHits = (twse.data || []).filter(r => String(r[2]).trim() === stockNo);
  if (twseHits.length) {
    const r0 = twseHits[0];
    const endStr = r0[6].split('～').pop().trim();
    const endDate = rocToDate(endStr);
    const days = endDate ? daysDiff(TODAY, endDate) + 1 : '?';
    return row('bad', `🔴 處置股中｜期間：${r0[6]}｜距解除：${days}天｜${r0[4]}累計，${r0[5]}`);
  }
  // TPEx 上櫃
  try {
    const tpex = await getTpexPunish();
    const rows = tpex.tables?.[0]?.data || [];
    const hits = rows.filter(r => String(r[2]).trim() === stockNo);
    if (hits.length) {
      const r0 = hits[0];
      const period = String(r0[5]);
      const endStr = period.split('~').pop().trim();
      const endDate = rocToDate(endStr);
      const days = endDate ? daysDiff(TODAY, endDate) + 1 : '?';
      return row('bad', `🔴 處置股中（上櫃）｜期間：${period}｜距解除：${days}天｜累計${r0[4]}次`);
    }
  } catch(e) {}
  return row('ok', '✅ 處置股：無');
}

function noticeLevel(count) {
  if (count >= 3) return { cls: 'bad',  icon: '🔴 高警示（即將被處置）' };
  if (count == 2) return { cls: 'warn', icon: '⚠️ 警示（再累計可能被處置）' };
  return               { cls: 'warn', icon: '📌 注意股（首次）' };
}

async function checkNotice(stockNo) {
  // TWSE 上市
  const twse = await getNotice();
  const twseHits = (twse.data || []).filter(r => String(r[1]).trim() === stockNo);
  if (twseHits.length) {
    const r0 = twseHits[0];
    const count = parseInt(r0[3]) || 0;
    const reason = r0[4].replace(/<[^>]+>/g, '');
    const { cls, icon } = noticeLevel(count);
    return row(cls, `${icon}｜累計：${count}次｜${r0[5]}收盤：${r0[6]}｜${reason}`);
  }
  // TPEx 上櫃
  try {
    const tpex = await getTpexNotice();
    const rows = tpex.tables?.[0]?.data || [];
    const hits = rows.filter(r => String(r[1]).trim() === stockNo);
    if (hits.length) {
      const r0 = hits[0];
      const count = parseInt(r0[3]) || 0;
      const reason = String(r0[4]).replace(/<[^>]+>/g, '').slice(0, 80);
      const { cls, icon } = noticeLevel(count);
      return row(cls, `${icon}（上櫃）｜累計：${count}次｜${r0[5]}收盤：${r0[6]}｜${reason}`);
    }
  } catch(e) {}
  return row('ok', '✅ 注意股：無');
}

const NOTE_MAP = {
  'X':   '停止融資',
  'V':   '停止融券',
  'XV':  '全額交割（停止融資+融券）',
  'XV!': '全額交割+額外限制',
  'V!':  '停止融券+額外限制',
  'Y':   '特殊交易類別',
  'Z':   '其他限制',
};

function buildMarginLines(note, marginBal, marginLimit, shortBal, usePctStr, srPctStr, label) {
  // label: '' for TWSE, '（上櫃）' for TPEx
  const noteDesc = NOTE_MAP[note] || (note ? `限制代碼：${note}` : '');
  const lines = [];

  if (note.includes('XV')) {
    lines.push(row('bad', `🔴 全額交割股${label}｜${noteDesc}`));
  } else {
    lines.push(row('ok', `✅ 全額交割：否${label}`));
  }

  if (note.includes('X')) {
    lines.push(row('bad', `🔴 融資：不開放（${noteDesc}）<span style="font-size:0.78rem;color:#888">｜無法用融資買進，只能現股操作</span>`));
  } else {
    const pn = parseFloat(usePctStr);
    const uc = pn >= 70 ? '#c0392b' : pn >= 40 ? '#c07800' : '#2a7a2a';
    const useTag = `｜<span style="color:${uc}">使用率 ${usePctStr}%</span><span style="font-size:0.78rem;color:#888">（使用率高→散戶槓桿重，反轉時賣壓大）</span>`;
    lines.push(row('ok', `✅ 融資開放｜餘額：${marginBal.toLocaleString()} 張${useTag}`));
  }

  if (note.includes('V')) {
    lines.push(row('warn', `⚠️ 融券：不開放 <span style="font-size:0.78rem;color:#888">｜無法放空此股</span>`));
  } else {
    let srTag = '';
    if (!note.includes('X') && marginBal > 0 && srPctStr !== null) {
      const pn = parseFloat(srPctStr);
      const sc = pn >= 25 ? '#c0392b' : pn >= 10 ? '#c07800' : '#2a7a2a';
      srTag = `｜券資比 <span style="color:${sc}">${srPctStr}%</span><span style="font-size:0.78rem;color:#888">（>25% 空方集中，軋空風險高；<10% 空方少）</span>`;
    }
    lines.push(row('', `　 融券餘額：${shortBal.toLocaleString()} 張${srTag}`));
  }
  return lines;
}

async function checkMargin(stockNo) {
  const toN = s => parseInt(String(s).replace(/,/g,'')) || 0;

  // TWSE 上市
  const twseData = await getMargin();
  const twseHit = (twseData.data || []).find(r => String(r[0]).trim() === stockNo);
  if (twseHit) {
    const note      = twseHit[14].trim();
    const marginBal = toN(twseHit[6]);
    const marginLim = toN(twseHit[7]);
    const shortBal  = toN(twseHit[12]);
    const usePct    = marginLim > 0 ? (marginBal / marginLim * 100).toFixed(1) : '0.0';
    const srPct     = marginBal > 0 ? (shortBal / marginBal * 100).toFixed(1) : null;
    return buildMarginLines(note, marginBal, marginLim, shortBal, usePct, srPct, '');
  }

  // TPEx 上櫃
  try {
    const tpexData = await getTpexMargin();
    const rows = tpexData.tables?.[0]?.data || [];
    const hit = rows.find(r => String(r[0]).trim() === stockNo);
    if (hit) {
      const note      = String(hit[19] || '').trim();
      const marginBal = toN(hit[6]);
      const shortBal  = toN(hit[14]);
      const usePct    = String(hit[8]);   // TPEx 直接提供 %
      const srPct     = String(hit[16]);
      return buildMarginLines(note, marginBal, 0, shortBal, usePct, srPct, '（上櫃）');
    }
  } catch(e) {}

  return [row('warn', '⚠️ 融資：查無資料（可能未開放信用交易）')];
}

async function checkExRight(stockNo) {
  const startD = fmtDate(TODAY);
  const endD   = fmtDate(addDays(TODAY, 30));
  const data   = await getExRight(startD, endD);
  const hits   = (data.data || []).filter(r => String(r[1]).trim() === stockNo);
  const src = `<span style="font-size:0.78rem;color:#aaa">（TWSE TWT49U，${startD}～${endD}，上市股票）</span>`;
  if (!hits.length) return row('ok', `✅ 除息/除權：未來30天無 ${src}`);
  return hits.map(r =>
    row('warn', `⚠️ 除${r[6]==='息'?'息':'權息'}｜日期：${r[0]}｜息值：${r[5]}｜參考價：${r[4]} ${src}`)
  ).join('');
}

async function checkFutures(stockNo) {
  const lines = [];
  try {
    const codes = await getFuturesList();
    if (codes.has(stockNo)) lines.push(row('ok', '✅ 已有股票期貨'));
    else lines.push(row('', '　 無股票期貨'));
  } catch(e) {
    lines.push(row('warn', '⚠️ 期貨清單查詢失敗'));
  }

  // 即將開放期貨（TAIFEX公告）
  try {
    const html = await getTaifexAnnouncements();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    for (const tr of doc.querySelectorAll('table tr')) {
      const cells = tr.querySelectorAll('td');
      if (cells.length < 2) continue;
      const title = cells[1].textContent.trim();
      if (title.includes(stockNo) && title.includes('新增') && title.includes('期貨')) {
        lines.push(row('info', `📢 即將/新增期貨｜${cells[0].textContent.trim()}｜${title.slice(0,60)}`));
      }
    }
  } catch(e) {}

  // 即將開放融資（TWSE公告）
  try {
    const startD = fmtDate(addDays(TODAY, -14));
    const endD   = fmtDate(addDays(TODAY, 30));
    const data   = await getMarginOpen(startD, endD);
    for (const r0 of (data.data || [])) {
      const title = r0[3] || '';
      if (!title.includes(stockNo)) continue;
      const m = title.match(/自(\d+)年(\d+)月(\d+)日起/);
      if (!m) continue;
      const openDate = new Date(parseInt(m[1])+1911, parseInt(m[2])-1, parseInt(m[3]));
      const label = openDate >= TODAY ? '📢 即將開放融資' : 'ℹ️ 近期新開放融資';
      lines.push(row('info', `${label}｜${openDate.toISOString().slice(0,10)} 起`));
    }
  } catch(e) {}

  return lines;
}

function checkLinks(stockNo) {
  return [
    row('link', `📋 重大訊息（增資/減資/GDR/CB）：<a href="https://mops.twse.com.tw/mops/web/t05st01?step=1&firstin=Y&off=1&co_id=${stockNo}" target="_blank">開啟 MOPS →</a> <span class="link-note">進入後手動輸入 <b>${stockNo}</b> 按查詢｜確認近期有無影響股價結構的事件</span>`),
    row('link', `📅 法說會行事曆：<a href="https://mops.twse.com.tw/mops/web/t100sb01?step=1&firstin=Y&off=1&TYPEK=sii&co_id=${stockNo}" target="_blank">開啟 MOPS →</a> <span class="link-note">進入後手動輸入 <b>${stockNo}</b> 按查詢｜法說會前後波動大，避免前夕進場承擔不對稱風險</span>`),
  ];
}

// ── Tag 輸入邏輯 ──
const tags = [];

function renderTags() {
  const box = document.getElementById('tagBox');
  const input = document.getElementById('stockInput');
  box.querySelectorAll('.tag').forEach(t => t.remove());
  tags.forEach((code, i) => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.innerHTML = `${code}<span class="del" onclick="removeTag(${i})">×</span>`;
    box.insertBefore(tag, input);
  });
}

function validateCode(raw) {
  const code = raw.trim().replace(/[^0-9A-Za-z]/g, '');
  if (!code) return { ok: false, msg: '' };
  if (!/^\d/.test(code)) return { ok: false, msg: `「${code}」需以數字開頭` };
  if (code.length < 4 || code.length > 6) return { ok: false, msg: `「${code}」長度應為 4–6 碼` };
  return { ok: true, code };
}

function showInputErr(msg) {
  const el = document.getElementById('inputErr');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function addTag(val) {
  const v = validateCode(val);
  if (!v.ok) { showInputErr(v.msg); return; }
  if (tags.includes(v.code)) { showInputErr(`${v.code} 已在清單中`); return; }
  showInputErr('');
  tags.push(v.code);
  renderTags();
}

function addFromInput() {
  const input = document.getElementById('stockInput');
  if (input.value.trim()) { addTag(input.value); input.value = ''; }
  input.focus();
}

function removeTag(i) {
  tags.splice(i, 1);
  renderTags();
}

function clearAll() {
  tags.length = 0;
  renderTags();
  document.getElementById('results').innerHTML = '';
  document.getElementById('error').style.display = 'none';
}

document.getElementById('stockInput').addEventListener('keydown', e => {
  const input = e.target;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (input.value.trim()) { addTag(input.value); input.value = ''; }
    else if (tags.length) runCheck();
  }
  if (e.key === 'Backspace' && !input.value && tags.length) {
    removeTag(tags.length - 1);
  }
});

// ── 股票名稱查詢 ──
async function getStockName(stockNo) {
  // TWSE 融資融券
  const marginData = await getMargin();
  const mh = (marginData.data || []).find(r => String(r[0]).trim() === stockNo);
  if (mh) return mh[1].trim();
  // TWSE 注意股
  const noticeData = await getNotice();
  const nh = (noticeData.data || []).find(r => String(r[1]).trim() === stockNo);
  if (nh) return nh[2].trim();
  // TWSE 處置股
  const punishData = await getPunish();
  const ph = (punishData.data || []).find(r => String(r[2]).trim() === stockNo);
  if (ph) return ph[3].trim();
  // TPEx 融資融券
  try {
    const tpexData = await getTpexMargin();
    const rows = tpexData.tables?.[0]?.data || [];
    const th = rows.find(r => String(r[0]).trim() === stockNo);
    if (th) return th[1].trim() + '（上櫃）';
  } catch(e) {}
  // TPEx 注意股
  try {
    const tpexNotice = await getTpexNotice();
    const rows = tpexNotice.tables?.[0]?.data || [];
    const tn = rows.find(r => String(r[1]).trim() === stockNo);
    if (tn) return tn[2].trim() + '（上櫃）';
  } catch(e) {}
  return '';
}

// ── 主流程 ──
async function checkOne(stockNo) {
  const [name, punish, notice, margin, exright, futures] = await Promise.all([
    getStockName(stockNo),
    checkPunish(stockNo),
    checkNotice(stockNo),
    checkMargin(stockNo),
    checkExRight(stockNo),
    checkFutures(stockNo),
  ]);
  const links = checkLinks(stockNo);

  // 判斷是否查無資料（代號不存在）
  const noMargin  = margin.length === 1 && margin[0].includes('查無資料');
  const noPunish  = punish.includes('無');
  const noNotice  = notice.includes('無');
  const noExright = exright.includes('未來30天無');
  if (!name && noMargin && noPunish && noNotice && noExright) {
    return `
      <div class="result-block" style="border-color:#f5c6cb">
        <h2 style="color:#c0392b">⚠️ ${stockNo}｜查無此股票</h2>
        <div class="row warn">代號 ${stockNo} 查無資料，請確認代號是否正確（本工具僅支援上市/上櫃普通股）。</div>
      </div>`;
  }

  const title = name ? `${stockNo}｜${name}` : stockNo;
  const all = [notice, punish, ...margin, exright, ...futures, ...links].join('');
  return `
    <div class="result-block">
      <h2>📊 ${title}</h2>
      ${all}
    </div>`;
}

async function runCheck() {
  const inputEl = document.getElementById('stockInput');
  if (inputEl.value.trim()) { addTag(inputEl.value); inputEl.value = ''; }
  if (!tags.length) return;
  const stocks = [...tags];

  const resultsEl = document.getElementById('results');
  document.getElementById('loading').style.display = 'none';
  document.getElementById('error').style.display   = 'none';
  document.getElementById('queryBtn').disabled      = true;
  resultsEl.innerHTML = '';

  // 先插入佔位卡片（立即顯示骨架）
  stocks.forEach(s => {
    const div = document.createElement('div');
    div.className = 'result-block';
    div.id = `card-${s}`;
    div.innerHTML = `<h2>📊 ${s}</h2><div class="row" style="color:#aaa">⏳ 查詢中…</div>`;
    resultsEl.appendChild(div);
  });

  // 各股並行，完成一檔就立即更新該卡片
  await Promise.all(stocks.map(async s => {
    try {
      const html = await checkOne(s);
      const tmp = document.createElement('div');
      tmp.innerHTML = html.trim();
      const card = document.getElementById(`card-${s}`);
      if (card) card.replaceWith(tmp.firstElementChild);
    } catch(e) {
      const card = document.getElementById(`card-${s}`);
      if (card) card.innerHTML = `<h2 style="color:#c0392b">⚠️ ${s}</h2><div class="row bad">查詢失敗：${e.message}</div>`;
    }
  }));

  document.getElementById('queryBtn').disabled = false;
}

</script>
</body>
