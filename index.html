<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股產業儀表板</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --bg2:       #181c24;
      --bg3:       #1e2330;
      --bg4:       #252b3b;
      --border:    #2a3044;
      --text:      #e2e8f0;
      --text2:     #94a3b8;
      --text3:     #64748b;
      --green:     #22c55e;
      --lime:      #84cc16;
      --orange:    #f97316;
      --red:       #ef4444;
      --gray:      #64748b;
      --blue:      #3b82f6;
      --accent:    #6366f1;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header-left .subtitle {
      font-size: 11px;
      color: var(--text3);
      margin-top: 2px;
    }

    .last-updated {
      font-size: 11px;
      color: var(--text3);
      text-align: right;
    }

    /* ── Main ───────────────────────────────────────────────────────────── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    /* ── Legend ─────────────────────────────────────────────────────────── */
    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text2);
    }

    /* ── Industry Block ──────────────────────────────────────────────────── */
    .industry-block {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    /* ── Row base ───────────────────────────────────────────────────────── */
    .row {
      display: grid;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }

    .row:hover { background: var(--bg4); }

    /* industry row: dot | name | cmf-bar | breadth-120 | breadth-20 | drawdown | chevron */
    .row-industry {
      background: var(--bg2);
      grid-template-columns: 10px 1fr 160px 72px 72px 72px 16px;
    }

    /* sub-industry row */
    .row-sub {
      background: var(--bg3);
      border-top: 1px solid var(--border);
      grid-template-columns: 10px 1fr 160px 72px 72px 72px 16px;
      padding-left: 32px;
    }

    .row-sub:first-child { border-top: 1px solid var(--border); }

    /* stock row */
    .row-stock {
      background: var(--bg);
      border-top: 1px solid var(--border);
      grid-template-columns: 10px 52px 1fr 80px 72px 72px 72px;
      padding-left: 56px;
      cursor: default;
      font-size: 12px;
    }

    .row-stock:hover { background: var(--bg2); }

    /* column headers */
    .col-headers {
      display: grid;
      gap: 12px;
      padding: 6px 16px 6px 56px;
      background: var(--bg3);
      border-top: 1px solid var(--border);
      color: var(--text3);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      grid-template-columns: 10px 52px 1fr 80px 72px 72px 72px;
    }

    /* table headers for industry/sub level */
    .table-header {
      display: grid;
      gap: 12px;
      padding: 6px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      color: var(--text3);
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      grid-template-columns: 10px 1fr 160px 72px 72px 72px 16px;
    }

    /* ── Status Dot ─────────────────────────────────────────────────────── */
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.bull_stable   { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.bull_volatile { background: var(--lime);  box-shadow: 0 0 6px var(--lime); }
    .dot.bull_weak     { background: var(--orange); }
    .dot.bear          { background: var(--red);   box-shadow: 0 0 6px var(--red); }
    .dot.neutral       { background: var(--gray); }
    .dot.unknown       { background: var(--gray); opacity: 0.4; }

    /* ── Name ───────────────────────────────────────────────────────────── */
    .name-cell { display: flex; flex-direction: column; }
    .name-zh   { font-weight: 500; }
    .name-en   { font-size: 11px; color: var(--text3); }
    .name-code { font-size: 11px; color: var(--text3); font-family: monospace; }

    /* ── CMF Bar ─────────────────────────────────────────────────────────── */
    .cmf-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cmf-bar-bg {
      flex: 1;
      height: 6px;
      background: var(--bg4);
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }

    .cmf-bar-fill {
      position: absolute;
      top: 0;
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s;
    }

    .cmf-bar-fill.pos { background: var(--green); left: 50%; }
    .cmf-bar-fill.neg { background: var(--red);   right: 50%; }

    .cmf-val {
      font-size: 11px;
      font-family: monospace;
      width: 44px;
      text-align: right;
      flex-shrink: 0;
    }

    .cmf-val.pos { color: var(--green); }
    .cmf-val.neg { color: var(--red); }
    .cmf-val.zero { color: var(--text3); }

    /* ── Breadth / Drawdown ──────────────────────────────────────────────── */
    .metric {
      font-size: 12px;
      font-family: monospace;
      text-align: right;
    }

    .metric.high   { color: var(--green); }
    .metric.mid    { color: var(--lime); }
    .metric.low    { color: var(--orange); }
    .metric.vlow   { color: var(--red); }
    .metric.neutral { color: var(--text2); }

    /* ── Chevron ─────────────────────────────────────────────────────────── */
    .chevron {
      color: var(--text3);
      font-size: 10px;
      transition: transform 0.2s;
      justify-self: end;
    }

    .chevron.open { transform: rotate(90deg); }

    /* ── Expand sections ─────────────────────────────────────────────────── */
    .sub-section  { display: none; }
    .sub-section.open  { display: block; }
    .stock-section { display: none; }
    .stock-section.open { display: block; }

    /* ── Loading / Error ─────────────────────────────────────────────────── */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }

    .error-msg {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      border-radius: 8px;
      padding: 16px;
      color: #fca5a5;
      margin: 20px 0;
    }

    /* ── Mobile ──────────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }

      .row-industry,
      .row-sub,
      .table-header {
        grid-template-columns: 10px 1fr 120px 60px 16px;
      }

      .row-stock,
      .col-headers {
        grid-template-columns: 10px 44px 1fr 60px 60px;
      }

      /* hide drawdown col on mobile */
      .hide-mobile { display: none; }
    }
  </style>
</head>

<script>
// ── Helpers ──────────────────────────────────────────────────────────────────

function dot(cls) {
  return `<span class="dot ${cls || 'unknown'}"></span>`;
}

function cmfBar(val) {
  if (val == null || isNaN(val)) return `<div class="cmf-wrap"><div class="cmf-bar-bg"></div><span class="cmf-val zero">—</span></div>`;
  const pct = Math.min(Math.abs(val) * 100, 50); // max 50% of bar
  const dir = val >= 0 ? 'pos' : 'neg';
  const label = (val >= 0 ? '+' : '') + val.toFixed(3);
  return `
    <div class="cmf-wrap">
      <div class="cmf-bar-bg">
        <div class="cmf-bar-fill ${dir}" style="width:${pct}%"></div>
      </div>
      <span class="cmf-val ${dir}">${label}</span>
    </div>`;
}

function breadthCell(val) {
  if (val == null) return `<span class="metric neutral">—</span>`;
  const pct = Math.round(val * 100);
  const cls = pct >= 70 ? 'high' : pct >= 50 ? 'mid' : pct >= 30 ? 'low' : 'vlow';
  return `<span class="metric ${cls}">${pct}%</span>`;
}

function drawdownCell(val) {
  if (val == null) return `<span class="metric neutral hide-mobile">—</span>`;
  const pct = Math.round(val * 100);
  const cls = pct <= 5 ? 'high' : pct <= 12 ? 'mid' : pct <= 20 ? 'low' : 'vlow';
  return `<span class="metric ${cls} hide-mobile">-${pct}%</span>`;
}

function bullBearLabel(code) {
  const map = {
    bull_stable: '多頭穩', bull_volatile: '多頭震',
    bull_weak: '多頭弱', bear: '空頭', neutral: '過渡', unknown: '—'
  };
  return map[code] || code;
}

// ── Render ───────────────────────────────────────────────────────────────────

function renderStock(s) {
  const ind = s.indicators;
  if (!ind) {
    return `
      <div class="row row-stock">
        ${dot('unknown')}
        <span class="name-code">${s.code}</span>
        <span class="name-zh" style="color:var(--text3)">${s.name} (無資料)</span>
        <span></span><span></span><span></span><span></span>
      </div>`;
  }
  return `
    <div class="row row-stock">
      ${dot(ind.bull_bear)}
      <span class="name-code">${s.code}</span>
      <span class="name-cell">
        <span class="name-zh">${s.name}</span>
      </span>
      <span class="metric neutral" style="text-align:right">${ind.close.toLocaleString()}</span>
      ${cmfBar(ind.cmf_20)}
      ${breadthCell(ind.above_ma120 != null ? (ind.above_ma120 ? 1 : 0) : null)}
      ${drawdownCell(ind.drawdown)}
    </div>`;
}

function renderSub(sub, indId) {
  const s = sub.summary || {};
  const subId = `${indId}_${sub.id}`;
  const stocks = sub.stocks || [];
  return `
    <div class="sub-section open" id="sub_${indId}">
      <div class="col-headers hide-mobile" style="display:none"></div>
      <div class="row row-sub" onclick="toggleStocks('${subId}')">
        ${dot(s.bull_bear)}
        <span class="name-cell">
          <span class="name-zh">${sub.name}</span>
          <span class="name-en">${s.stock_count || 0} 支</span>
        </span>
        ${cmfBar(s.cmf_20)}
        ${breadthCell(s.breadth_120)}
        ${breadthCell(s.breadth_20)}
        ${drawdownCell(s.avg_drawdown)}
        <span class="chevron" id="chev_${subId}">▶</span>
      </div>
      <div class="stock-section" id="stocks_${subId}">
        <div class="col-headers">
          <span></span>
          <span>代號</span>
          <span>名稱</span>
          <span style="text-align:right">收盤</span>
          <span>CMF(20)</span>
          <span style="text-align:right">MA120</span>
          <span style="text-align:right" class="hide-mobile">回檔</span>
        </div>
        ${stocks.map(renderStock).join('')}
      </div>
    </div>`;
}

function renderIndustry(ind) {
  const s = ind.summary || {};
  const subs = ind.sub_industries || [];
  return `
    <div class="industry-block">
      <div class="table-header">
        <span></span>
        <span>產業</span>
        <span>CMF (20日)</span>
        <span style="text-align:right">MA120站上</span>
        <span style="text-align:right">MA20站上</span>
        <span style="text-align:right" class="hide-mobile">平均回檔</span>
        <span></span>
      </div>
      <div class="row row-industry" onclick="toggleSub('${ind.id}')">
        ${dot(s.bull_bear)}
        <span class="name-cell">
          <span class="name-zh">${ind.name}</span>
          <span class="name-en">${ind.name_en}</span>
        </span>
        ${cmfBar(s.cmf_20)}
        ${breadthCell(s.breadth_120)}
        ${breadthCell(s.breadth_20)}
        ${drawdownCell(s.avg_drawdown)}
        <span class="chevron open" id="chev_${ind.id}">▶</span>
      </div>
      ${subs.map(sub => renderSub(sub, ind.id)).join('')}
    </div>`;
}

// ── Toggle ───────────────────────────────────────────────────────────────────

function toggleSub(indId) {
  document.querySelectorAll(`#sub_${indId}`).forEach(el => {
    el.classList.toggle('open');
  });
  const chev = document.getElementById(`chev_${indId}`);
  if (chev) chev.classList.toggle('open');
}

function toggleStocks(subId) {
  const el = document.getElementById(`stocks_${subId}`);
  if (el) el.classList.toggle('open');
  const chev = document.getElementById(`chev_${subId}`);
  if (chev) chev.classList.toggle('open');
}

// ── Main ─────────────────────────────────────────────────────────────────────

async function init() {
  const dash = document.getElementById('dashboard');
  try {
    let data;
    // file:// 協定無法用 fetch，改讀內嵌資料
    if (location.protocol === 'file:' && typeof INLINE_DATA !== 'undefined') {
      data = INLINE_DATA;
    } else {
      const resp = await fetch('data/indicators.json?' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      data = await resp.json();
    }

    document.getElementById('lastUpdated').innerHTML =
      `更新日期：${data.last_updated}`;

    dash.innerHTML = (data.industries || []).map(renderIndustry).join('');
  } catch (e) {
    dash.innerHTML = `<div class="error-msg">❌ 資料載入失敗：${e.message}<br>
      <small>請確認 data/indicators.json 存在，或重新執行 fetch_and_calc.py</small></div>`;
  }
}

init();
</script>
